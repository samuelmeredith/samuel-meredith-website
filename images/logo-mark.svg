<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Samuel Meredith">

  <!-- Background square -->
  <rect width="48" height="48" fill="#1A1209"/>

  <!-- Terracotta accent — top rule -->
  <rect x="11" y="11" width="10" height="0.75" fill="#C4622D"/>

  <!-- S — italic serif -->
  <text
    x="24" y="38"
    font-family="Georgia, 'Cormorant Garamond', serif"
    font-style="italic"
    font-size="34"
    font-weight="400"
    text-anchor="middle"
    fill="#FAF7F2">S</text>

  <!-- Terracotta accent dot — bottom right -->
